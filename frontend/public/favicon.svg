<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.35" />

  <!-- Ambient Glow Behind Loop -->
  <path d="M176 192 C120 192 80 224 80 256 C80 288 120 320 176 320 C232 320 280 256 336 256 C392 256 432 288 432 256 C432 224 392 192 336 192 C280 192 232 256 176 256"
        fill="none" stroke="url(#loopGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#glow)" />

  <!-- Infinity / Continuous Play Loop Core -->
  <path d="M176 192 C120 192 84 220 84 256 C84 292 120 320 176 320 C232 320 280 192 336 192 C392 192 428 220 428 256 C428 292 392 320 336 320 C280 320 232 192 176 192 Z"
        fill="none" stroke="url(#loopGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Soundwave Center Bars Inside Loop Nodes -->
  <!-- Left Loop Wave Pulse -->
  <rect x="156" y="234" width="10" height="44" rx="5" fill="url(#waveGrad)" />
  <rect x="176" y="220" width="10" height="72" rx="5" fill="url(#waveGrad)" />
  <rect x="196" y="240" width="10" height="32" rx="5" fill="url(#waveGrad)" />

  <!-- Right Loop Play Spark -->
  <polygon points="328,230 366,256 328,282" fill="#ffffff" opacity="0.95" />
</svg>
