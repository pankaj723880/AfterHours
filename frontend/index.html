<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title -->
    <title>Loopra - Retro & High-Vibe Radio</title>

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="/loopra-logo.png" />
    
    <!-- Apple Touch Icon (iOS Home Screen) -->
    <link rel="apple-touch-icon" href="/loopra-logo.png" />

    <!-- Web App Manifest for PWA Support -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Browser Address Bar Theme Color (Matches your Dark App Theme) -->
    <meta name="theme-color" content="#121212" />

    <!-- Immediate Theme Application to prevent layout/color flash on load -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('afterhours_applied_theme') || localStorage.getItem('afterhours_cms_public_config');
          if (raw) {
            var data = JSON.parse(raw);
            var theme = data.theme || data;
            if (theme && theme.accentColor) {
              var hex = theme.accentColor.replace('#', '').trim();
              if (hex.length === 3) hex = hex.split('').map(function(c) { return c + c; }).join('');
              var num = parseInt(hex, 16);
              if (!isNaN(num)) {
                var r = (num >> 16) & 255;
                var g = (num >> 8) & 255;
                var b = num & 255;
                document.documentElement.style.setProperty('--accent-color', theme.accentColor);
                document.documentElement.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
              }
            }
            if (theme && theme.themeMode) {
              document.documentElement.setAttribute('data-theme', theme.themeMode);
            }
            if (theme && theme.glassmorphism === false) {
              document.documentElement.classList.add('no-glass');
              document.documentElement.style.setProperty('--glass-blur', '0px');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background-color: #09090b; margin: 0; padding: 0; overflow-x: hidden;">
    <div id="root">
      <div id="initial-splash-fallback" style="position: fixed; inset: 0; z-index: 99999; background: #09090b; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Outfit', 'Inter', -apple-system, sans-serif; user-select: none;">
        <div style="position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -20px; background: radial-gradient(circle, rgba(245, 158, 11, 0.22) 0%, rgba(234, 88, 12, 0.12) 50%, transparent 70%); border-radius: 9999px; filter: blur(24px);"></div>
          <img src="/loopra-logo.png" alt="Loopra Logo" style="width: 88px; height: 88px; object-fit: contain; position: relative; z-index: 10; filter: drop-shadow(0 0 25px rgba(245,158,11,0.55));" />
        </div>
        <div style="margin-top: 20px; text-align: center;">
          <div style="font-size: 24px; font-weight: 900; letter-spacing: 0.15em; color: #ffffff; text-transform: uppercase;">LOOPRA</div>
          <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.05em; color: #fbbf24; margin-top: 6px;">Retro & High-Vibe Radio</div>
        </div>
        <div style="margin-top: 28px; width: 160px; height: 4px; background: #1c1917; border-radius: 9999px; overflow: hidden; border: 1px solid rgba(245, 158, 11, 0.25);">
          <div style="width: 60%; height: 100%; background: linear-gradient(90deg, #f59e0b, #ea580c, #fde047); border-radius: 9999px;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
